{% extends "base.html" %}
{% block body_class %}page-globe{% endblock %}
{% block head %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
{% endblock %}
{% block topbar_tools %}
  <div class="tools" role="toolbar" aria-label="日期、時間與檢視">
    <div class="stepper" id="stepper">
      <button type="button" class="icon-btn" id="date-prev" aria-label="前一天">‹</button>
      <select id="date" aria-label="預報日期" disabled></select>
      <button type="button" class="icon-btn" id="date-next" aria-label="後一天">›</button>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <div class="clock">
      <button type="button" class="icon-btn" id="clock-play" aria-pressed="false" aria-label="播放一天的日照與建築陰影" title="播放一天的日照與建築陰影">▶</button>
      <span class="clock-icon" id="clock-icon" aria-hidden="true">☾</span>
      <input type="range" id="clock" min="0" max="1439" step="10" aria-label="日照模擬時間">
      <output id="clock-label" for="clock">現在</output>
      <button type="button" class="chip" id="clock-now" hidden>回到現在</button>
    </div>
    <span class="divider" aria-hidden="true"></span>
    <button type="button" class="icon-btn" id="shadows" aria-pressed="false" title="地形陰影" aria-label="地形陰影">◐</button>
    <button type="button" class="icon-btn text" id="mode" aria-pressed="false" title="切換 2D／3D" aria-label="2D 檢視">2D</button>
    <button type="button" class="icon-btn" id="home" title="全覽" aria-label="全覽">⌂</button>
  </div>
{% endblock %}
{% block content %}
<main class="stage">
  <div id="globe" class="globe" aria-label="臺灣 3D 地圖"></div>
  <div id="loading" class="loading">
    <div class="loading-card glass" data-refract>
      <div class="spinner" aria-hidden="true"></div>
      <p>載入 3D 臺灣…</p>
    </div>
  </div>
  <div id="fallback" class="fallback" hidden></div>

  <aside class="controls glass" data-refract aria-label="地圖圖層">
    <div class="control-title">圖層</div>
    <div id="layers" role="radiogroup" aria-label="圖層">
      <button type="button" role="radio" data-value="now" aria-checked="true">即時</button>
      <button type="button" role="radio" data-value="maxt" aria-checked="false">最高</button>
      <button type="button" role="radio" data-value="mint" aria-checked="false">最低</button>
      <button type="button" role="radio" data-value="pop" aria-checked="false">降雨</button>
    </div>
    <label class="field">
      <span class="control-title">縣市</span>
      <select id="county">
        <option value="">選擇縣市…</option>
        {% for name in counties %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
      </select>
    </label>

    <details class="group" id="group-map" open>
    <summary class="control-title">地圖圖層</summary>
    <div class="toggles" id="overlays">
      <label class="toggle" data-overlay="typhoon">
        <input type="checkbox" data-overlay="typhoon">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="toggle-text">颱風路徑<small data-note="路徑與 70% 潛勢">路徑與 70% 潛勢</small></span>
      </label>
    </div>
    </details>

    <details class="group" id="group-3d" open>
    <summary class="control-title">3D</summary>
    <div class="toggles">
      <label class="toggle">
        <input type="checkbox" id="buildings">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="toggle-text">建築模型<small id="buildings-note">OpenStreetMap · 拉近後顯示</small></span>
      </label>
    </div>
    <div class="sim-places">
      <div id="sim-cities" role="radiogroup" aria-label="建築定位">
        <button type="button" role="radio" data-value="taipei" aria-checked="true"><b>北</b>臺北 101</button>
        <button type="button" role="radio" data-value="taichung" aria-checked="false"><b>中</b>臺中七期</button>
        <button type="button" role="radio" data-value="kaohsiung" aria-checked="false"><b>南</b>高雄 85</button>
      </div>
      <p class="sim-hint">按上方 ▶ 播放一天，模擬建築陰影</p>
    </div>
    </details>

    <div class="legend card-legend" id="legend" aria-label="圖例"></div>
  </aside>

  <div id="hover" class="hover-card glass" hidden></div>

  <section id="panel" class="panel glass glass-strong" data-refract="48" aria-label="縣市天氣" hidden>
    <button type="button" class="panel-close icon-btn" id="panel-close" aria-label="關閉">×</button>
    <div id="panel-body" class="panel-body"></div>
  </section>

  <footer class="credit">資料：中央氣象署開放資料 · 縣市界：內政部國土測繪中心</footer>
</main>
{% endblock %}
{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
