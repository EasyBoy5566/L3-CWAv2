{% extends "base.html" %}
{% block body_class %}page-globe{% endblock %}
{% block head %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
{% endblock %}
{% block content %}
<main class="stage">
  <div id="globe" class="globe" aria-label="臺灣 3D 地圖"></div>
  <div id="loading" class="loading"><div class="spinner" aria-hidden="true"></div><p>載入 3D 臺灣…</p></div>
  <div id="fallback" class="fallback" hidden></div>

  <aside class="controls" aria-label="地圖控制">
    <section>
      <h2>圖層</h2>
      <div class="segmented" role="radiogroup" aria-label="圖層" id="layers">
        <button type="button" role="radio" data-layer="now" aria-checked="true">即時氣溫</button>
        <button type="button" role="radio" data-layer="maxt" aria-checked="false">預報最高</button>
        <button type="button" role="radio" data-layer="mint" aria-checked="false">預報最低</button>
        <button type="button" role="radio" data-layer="pop" aria-checked="false">降雨機率</button>
      </div>
    </section>
    <section>
      <label class="field">
        <span>預報日期</span>
        <select id="date" disabled></select>
      </label>
    </section>
    <section>
      <div class="legend" id="legend"></div>
    </section>
    <section>
      <label class="field">
        <span>縣市</span>
        <select id="county">
          <option value="">選擇縣市…</option>
          {% for name in counties %}<option value="{{ name }}">{{ name }}</option>{% endfor %}
        </select>
      </label>
    </section>
    <section>
      <h2>日照模擬 <output id="clock-label">現在</output></h2>
      <input type="range" id="clock" min="0" max="1439" step="10" aria-label="模擬時間">
      <div class="row">
        <button type="button" class="chip" id="clock-now">回到現在</button>
        <button type="button" class="chip" id="shadows" aria-pressed="false">地形陰影</button>
        <button type="button" class="chip" id="mode" aria-pressed="false">2D</button>
        <button type="button" class="chip" id="home">全覽</button>
      </div>
    </section>
  </aside>

  <div id="hover" class="hover-card" hidden></div>

  <section id="panel" class="panel" aria-label="縣市天氣" hidden>
    <button type="button" class="panel-close" id="panel-close" aria-label="關閉">×</button>
    <div id="panel-body" class="panel-body"></div>
  </section>

  <footer class="credit">資料：中央氣象署開放資料 · 縣市界：內政部國土測繪中心 · 3D：CesiumJS</footer>
</main>
{% endblock %}
{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
